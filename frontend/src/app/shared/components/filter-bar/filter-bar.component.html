<div class="mb-8 bg-[#161B22] p-4 rounded-lg border border-[#30363D] shadow-sm space-y-3">
  <div class="flex flex-col md:flex-row gap-4">
    <div class="flex-grow">
      <label for="filter-search" class="sr-only">ค้นหาตามชื่อหัวข้อ (Search by title)</label>
      <input
        id="filter-search"
        type="search"
        [ngModel]="search()"
        (ngModelChange)="onSearchInput($event)"
        placeholder="ค้นหาตามชื่อหัวข้อ... (Search by title)"
        class="w-full px-4 py-2 bg-[#0D1117] border border-[#30363D] rounded-md text-[#C9D1D9] text-xs font-mono focus:border-blue-500 focus-visible:outline-none transition-colors"
      />
    </div>

    <div class="md:w-48">
      <label for="filter-category" class="sr-only">กรองตามหมวดหมู่ (Filter by category)</label>
      <select
        id="filter-category"
        [(ngModel)]="category"
        (ngModelChange)="onSelectChange()"
        class="w-full px-4 py-2 bg-[#0D1117] border border-[#30363D] rounded-md text-[#C9D1D9] text-xs font-mono focus:border-blue-500 focus-visible:outline-none transition-colors appearance-none"
      >
        <option value="">ทุกหมวดหมู่ (ALL_CATEGORIES)</option>
        @for (option of suggestions().categories; track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
    </div>

    <div class="md:w-48">
      <label for="filter-model" class="sr-only">กรองตามโมเดล (Filter by model)</label>
      <select
        id="filter-model"
        [(ngModel)]="selectedModel"
        (ngModelChange)="onSelectChange()"
        class="w-full px-4 py-2 bg-[#0D1117] border border-[#30363D] rounded-md text-[#C9D1D9] text-xs font-mono focus:border-blue-500 focus-visible:outline-none transition-colors appearance-none"
      >
        <option value="">ทุกโมเดล (ALL_MODELS)</option>
        @for (option of suggestions().models; track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
    </div>
  </div>

  @if (selectedTags().length > 0 || availableTags().length > 0) {
    <div class="flex flex-wrap items-center gap-1.5 pt-1 border-t border-[#30363D]">
      <span class="text-[10px] font-mono text-[#8B949E] uppercase tracking-tighter mr-1 mt-2">แท็ก (TAGS):</span>

      @for (tag of selectedTags(); track tag) {
        <button
          type="button"
          (click)="removeTag(tag)"
          [attr.aria-label]="'เอาแท็ก ' + tag + ' ออกจากตัวกรอง'"
          class="mt-2 inline-flex items-center gap-1 px-2 py-0.5 rounded bg-blue-500/20 border border-blue-500/50 text-blue-300 text-[11px] hover:bg-blue-500/30 transition-colors"
        >
          #{{ tag }} <span aria-hidden="true">&times;</span>
        </button>
      }

      @for (tag of availableTags(); track tag) {
        <button
          type="button"
          (click)="addTag(tag)"
          [attr.aria-label]="'กรองตามแท็ก ' + tag"
          class="mt-2 px-2 py-0.5 rounded bg-[#0D1117] border border-[#30363D] text-[#8B949E] text-[11px] hover:border-blue-500 hover:text-blue-400 transition-colors"
        >
          #{{ tag }}
        </button>
      }
    </div>
  }
</div>
